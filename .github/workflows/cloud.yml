name: Облачный мониторинг и бот
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [probe, run, control]
        default: probe
  schedule:
    - cron: '17 6,10 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cloud-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверить портал и методы
        if: inputs.mode == 'probe'
        env:
          B24_WEBHOOK: ${{ secrets.B24_WEBHOOK }}
        run: python bot_cloud.py --probe
      - name: Проверки качества
        if: inputs.mode != 'probe'
        run: python -m unittest discover -v
      - name: Материалы и бесплатная модель
        if: inputs.mode != 'probe'
        env:
          CONTROL_RUN: ${{ inputs.mode == 'control' && 'yes' || 'no' }}
        run: python cloud_monitor.py
      - name: Зафиксировать публичное состояние
        if: inputs.mode != 'probe'
        run: |
          git config user.name cbr-monitor
          git config user.email cbr-monitor@users.noreply.github.com
          git add cloud-state.json public/
          git diff --staged --quiet || git commit -m "Cloud monitor: public evidence and status"
          git push origin HEAD:main
      - name: Доставка в подтверждённый чат
        if: inputs.mode != 'probe'
        env:
          B24_WEBHOOK: ${{ secrets.B24_WEBHOOK }}
        run: python bot_cloud.py
      - name: Подтвердить доставку в состоянии
        if: inputs.mode != 'probe'
        run: |
          python cloud_monitor.py --ack
          git add cloud-state.json
          git diff --staged --quiet || git commit -m "Cloud monitor: acknowledge delivery"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        if: inputs.mode != 'probe'
      - uses: actions/upload-pages-artifact@v3
        if: inputs.mode != 'probe'
        with:
          path: public
      - uses: actions/deploy-pages@v4
        if: inputs.mode != 'probe'
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode != 'probe'
        with:
          name: public-quality-report
          path: public
          retention-days: 7
