name: Пять лет — сбор без отправки
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -v
      - run: python five_year_audit.py --llm-calls 3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: five-year-audit
          path: out/five-year-audit/
          retention-days: 14
