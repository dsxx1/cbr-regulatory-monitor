name: Мониторинг разъяснений ЦБ

on:
  schedule:
    # Время в UTC. Москва = UTC+3.
    # Оба окна попадают в льготный тариф DeepSeek (06:00-10:00 UTC),
    # чтобы будущий вызов модели стоил вдвое дешевле.
    - cron: '0 6 * * 1-5'    # 09:00 МСК, рабочие дни
    - cron: '30 9 * * 1-5'   # 12:30 МСК, рабочие дни
  workflow_dispatch:          # и кнопка «запустить вручную»

permissions:
  contents: write             # нужно, чтобы коммитить состояние обратно в репозиторий

concurrency:
  group: cbr-monitor
  cancel-in-progress: false   # прогоны не должны накладываться и портить состояние

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # зависший прогон обязан умереть сам

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v7

      - name: Поставить Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Прогон наблюдателя
        env:
          # Секреты задаются в Settings → Secrets and variables → Actions.
          # Пока их нет — прогон работает в режиме «тень»: только обнаружение.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_CALLS_PER_RUN: ${{ vars.LLM_MAX_CALLS_PER_RUN }}
          B24_WEBHOOK: ${{ secrets.B24_WEBHOOK }}
          B24_CHAT_ID: ${{ vars.B24_CHAT_ID }}
          B24_RESPONSIBLE_ID: ${{ vars.B24_RESPONSIBLE_ID }}
          MONITOR_GATEWAY_URL: ${{ vars.MONITOR_GATEWAY_URL }}
          MONITOR_SHARED_SECRET: ${{ secrets.MONITOR_SHARED_SECRET }}
        # Флаг --send намеренно НЕ передаётся. Даже при заданном B24_WEBHOOK
        # ничего наружу не уходит: очередь заполняется и показывается в отчёте.
        # Включение отправки — отдельное решение владельца процесса.
        run: |
          FLAG=""
          if [ "${{ vars.SEND_TO_BOT }}" = "yes" ]; then FLAG="--send"; fi
          python watch_cbr.py --state state.json --report docs/index.html --outbox outbox.json $FLAG

      - name: Выложить отчёт артефактом
        # Pages не работает на приватном репозитории при бесплатном плане,
        # поэтому отчёт скачивается прямо со страницы прогона.
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: otchet
          path: docs/index.html
          retention-days: 30

      - name: Зафиксировать состояние
        run: |
          git config user.name  "cbr-monitor"
          git config user.email "cbr-monitor@users.noreply.github.com"
          git add state.json docs/index.html outbox.json
          if git diff --staged --quiet; then
            echo "Состояние не изменилось — коммит не нужен."
          else
            git commit -m "Мониторинг ЦБ: прогон $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
